# Runs the automated checks on every push and pull request.
name: Tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    strategy:
      # Let each platform finish, so one platform's failure does not hide the other's result.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: node --test tests/*.test.cjs
      - name: Voice DSP, desktop integration, and feature tests (Electron under Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a node tests/voice-effects.cjs && xvfb-run -a node tests/integration.cjs && xvfb-run -a node tests/features.cjs
      - name: Voice DSP, desktop integration, and feature tests (Mac)
        if: runner.os == 'macOS'
        run: node tests/voice-effects.cjs && node tests/integration.cjs && node tests/features.cjs
      - name: Real system voices (evidence for the macOS speech adapter; does not block)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: node tests/tts-real.cjs
      - name: Keep test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ runner.os }}
          path: |
            test-results/*.json
            test-results/*.png
