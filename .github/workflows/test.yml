# Runs the automated checks on every push and pull request.
name: Tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Library tests
        run: node --test tests/library.test.cjs tests/platform.test.cjs tests/replay-buffer.test.cjs tests/limiter.test.cjs
      - name: Voice DSP and desktop integration tests (Electron under Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a node tests/voice-effects.cjs && xvfb-run -a node tests/integration.cjs
      - name: Voice DSP and desktop integration tests (Mac)
        if: runner.os == 'macOS'
        run: node tests/voice-effects.cjs && node tests/integration.cjs
      - name: Keep test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ runner.os }}
          path: |
            test-results/*.json
            test-results/*.png
