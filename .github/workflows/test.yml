# Runs the automated checks on every push and pull request.
name: Tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Library tests
        run: node --test tests/library.test.cjs
      - name: Voice DSP and desktop integration tests (Electron under Xvfb)
        run: xvfb-run -a node tests/voice-effects.cjs && xvfb-run -a node tests/integration.cjs
